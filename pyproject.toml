[project]
name = "forge"
version = "0.1.0"
description = "A system that turns a technology into an interactive environment where you learn by building."
readme = "readme.md"
authors = [
    { name = "KaisoX24", email = "acharjyapramit@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "crawl4ai>=0.9.4",
    "docker>=7.2.0",
    "fastapi[standard]>=0.141.1",
    "keyring>=25.7.0",
    "langchain-anthropic>=1.7.11",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.5.1",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langchain[ollama]>=1.4.2",
    "markdown>=3.11",
    "metadata-parser>=2.0.0",
    "packaging>=26.3",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "snowballstemmer>=2.2.0",
    "sqlalchemy>=2.1.3",
    "unstructured>=0.18.32",
    "uvicorn[standard]>=0.53.0",
]

[project.scripts]
forge = "forge:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
