[project]
name = "forge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "KaisoX24", email = "acharjyapramit@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "crawl4ai>=0.9.4",
    "docker>=7.2.0",
    "fastapi[standard]>=0.141.1",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "langchain[ollama]>=1.4.2",
    "markdown>=3.11",
    "metadata-parser>=2.0.0",
    "psutil>=7.2.2",
    "pydantic>=2.13.5",
    "scikit-learn>=1.9.1",
    "unstructured>=0.18.32",
]

[project.scripts]
forge = "forge:main"

[build-system]
requires = ["uv_build>=0.12.16,<0.13.0"]
build-backend = "uv_build"
